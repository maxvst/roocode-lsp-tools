  # KNOWN ISSUE: Requires VS Code Extension Host with full TypeScript Language Server.
  # The vscode.prepareTypeHierarchy + vscode.provideSupertypes API is not available
  # in the test-framework environment. Tests pass in real VS Code.
  - id: "supertypes-simple-inheritance"
    description: "Проверка поиска супертипов для класса с простым наследованием (ChildClass extends BaseClass)"
    toolPath: "../../src/go_to_supertypes_by_name.ts"
    toolName: "go_to_supertypes_by_name"
    params:
      file_path: "supertypes.ts"
      symbol_name: "ChildClass"
    expected:
      success: true
      contains: "BaseClass"
    timeout: 30000

