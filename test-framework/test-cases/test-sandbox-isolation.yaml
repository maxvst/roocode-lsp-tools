name: "Sandbox Isolation Test"
version: "1.0"
description: |
  Validates that the sandbox isolation mechanism correctly restores
  the workspace state between test cases.

testCases:
  - id: "delete-file-first"
    description: "First deletion of file_to_delete.txt"
    toolPath: "../test-tools/delete_file.ts"
    toolName: "delete_file"
    params:
      filePath: "file_to_delete.txt"
    expected:
      contains: "success"
      fileNotExists: "file_to_delete.txt"

  - id: "delete-file-second"
    description: "Second deletion of the same file (should work due to isolation)"
    toolPath: "../test-tools/delete_file.ts"
    toolName: "delete_file"
    params:
      filePath: "file_to_delete.txt"
    expected:
      contains: "success"
      fileNotExists: "file_to_delete.txt"
